[project]
name = "einstein"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv==4.0.1",
    "langgraph==1.2.10",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
]

[project.scripts]
einstein = "einstein.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["einstein"]
